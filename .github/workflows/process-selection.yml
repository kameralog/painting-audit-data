name: Process whole painting selection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/process-selection.mjs'
      - '.github/workflows/process-selection.yml'
permissions:
  contents: write
concurrency:
  group: painting-selection-processing
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: kameralog/kameralog.github.io
          ref: main
          path: site
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install image decoder
        run: npm install --no-save --package-lock=false sharp@0.33.5
      - name: Test and process every record
        run: |
          node tools/process-selection.mjs --test
          node tools/process-selection.mjs site
      - uses: actions/upload-artifact@v4
        with:
          name: processed-painting-selection
          path: processed-audit
      - name: Commit prepared bindings and results only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- processed-audit
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Process whole selection and prepare verified metadata bindings"
          git push origin HEAD:main
