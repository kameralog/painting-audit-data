name: Publish readable audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'catalogue-review-compact.json'
      - 'tools/publish-audit.mjs'
      - '.github/workflows/publish-audit.yml'
permissions:
  contents: write
concurrency:
  group: readable-audit
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate readable records and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node --check tools/publish-audit.mjs
            node tools/publish-audit.mjs
            git add generated-audit
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Publish readable audit records"
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 3))"
          done
          exit 1
